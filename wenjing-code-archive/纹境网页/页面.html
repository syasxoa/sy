<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f6f3e9"><title>纹境 · 团花与器物</title><style>{{CSS}}</style></head><body>
<a class="skip" href="#catalog">跳到纹样图录</a>
<header class="site-head"><div class="frame head-inner"><a class="brand" href="#home" aria-label="纹境首页"><span class="seal">纹</span>纹境</a><span class="mast-sub">中国传统纹样图录</span><button class="menu-toggle" aria-expanded="false" aria-controls="navigation">目录 ☰</button><nav id="navigation"><a href="#catalog">探索纹样</a><a href="#play">趣味互动</a><a href="#studio">纹样创作</a></nav></div></header>
<main id="home">
<section class="hero frame"><div class="hero-title"><p class="kicker"><i></i> 第壹辑　／　花卉与器物</p><h1>一瓣<span>生花</span><em>。</em></h1><p class="lead">从花心向外，读一枚团花。</p><p class="sub">八个方向，三重花瓣。让纹样在指尖旋开，再看它如何沿器身相连。</p></div>
<figure class="plate"><div class="plate-index"><b>图版</b><span>壹</span></div><span class="side-note">八向团花　·　构成习作</span><div id="hero-dock" class="art-dock"><div id="traveler"><div id="art-turn"><div id="art-breathe">{{MOTIF}}</div></div></div></div><figcaption><span>正视 · 全形</span><span class="swatches"><i></i><i></i><i></i></span></figcaption></figure>
<div class="hero-actions"><a class="cta" id="bloom" href="#play">让纹样绽开 <span>↗</span></a><a class="text-link" href="#catalog">翻阅图录 ↓</a></div></section>
<section class="catalog frame" id="catalog"><div class="chapter"><span>壹</span><div><p class="kicker">纹样图录</p><h2>取一隅，见全形。</h2></div><p>选一幅图版，近看它的线与色。</p></div>
<div class="gallery">
<button class="specimen featured" data-entry="dish"><div class="picture dish"><img src="{{DISH}}" alt="清雍正莲池纹盘，盘内绘莲花、荷叶和鸳鸯"></div><div class="legend"><div><small>01　/　馆藏实物</small><h3>莲池纹盘</h3><p>清 · 雍正　｜　景德镇瓷器</p></div><b>↗</b></div></button>
<button class="specimen flower" data-entry="flower"><div class="picture close-flower" aria-hidden="true"></div><div class="legend"><div><small>02　/　构成习作</small><h3>八向团花</h3></div><b>↗</b></div></button>
<button class="specimen fretted" data-entry="fret"><div class="picture fret-field" aria-hidden="true"></div><div class="legend"><div><small>03　/　构成习作</small><h3>方折回纹</h3></div><b>↗</b></div></button>
</div></section>
<section class="studio" id="studio"><div class="frame"><div class="chapter"><span>贰</span><div><p class="kicker">纹样创作</p><h2>把纹样绕上器身。</h2></div></div><div class="studio-grid"><div class="pot-stage"><span class="stage-code">器物观察台</span><canvas id="pot" tabindex="0" aria-label="陶罐三维预览，左右方向键旋转"></canvas><div class="stage-foot"><span>拖动旋转 · 滚轮缩放</span><button id="reset-pot">复位 ↺</button></div></div><form class="controls" onsubmit="return false"><label for="shape">器形</label><select id="shape"><option value="0">圆腹罐</option><option value="1">长颈瓶</option><option value="2">束腰罐</option></select><label for="repeat">环绕次数 <output for="repeat" id="repeat-value">8</output></label><input id="repeat" type="range" min="4" max="16" value="8"><label for="height">纹带位置</label><input id="height" type="range" min="-30" max="28" value="0"><label for="scale">取景大小</label><input id="scale" type="range" min="75" max="135" value="100"><button class="cta" id="photo" type="button">保存这一面 <span>↓</span></button></form></div></div></section>
<footer class="frame"><a class="brand" href="#home">纹境</a><span>第壹辑　·　花卉与器物</span><a href="#home">回到页首 ↑</a></footer></main>
<section id="immersive" hidden aria-label="独立纹样互动"><div class="room-head"><a href="#home" id="leave">← 返回纹境</a><span>纹样互动室</span></div><div class="room-center"><div class="room-caption"><small>图版　壹</small><h2>团花</h2><p>拖动纹样控制旋转，<br>轻点让花瓣旋开。</p></div><div id="room-dock" class="art-dock" tabindex="0" role="button" aria-label="轻点或按回车绽开，左右键旋转"></div></div><div class="room-controls"><button data-mode="spin" aria-pressed="false">自旋</button><button data-mode="breathe" aria-pressed="false">呼吸</button><button data-mode="split" aria-pressed="false">颜色分层</button><button id="room-bloom">再次绽开 ↗</button></div></section>
<dialog id="detail"><div class="dialog-top"><small>纹样图录　／　局部观察</small><button id="close-detail">关闭 ×</button></div><div class="detail-grid"><div class="inspect-window" id="inspect-window"><div id="inspect-art"></div></div><div class="detail-copy"><p class="kicker" id="item-type"></p><h2 id="item-title"></h2><p id="item-intro"></p><div class="spots" id="spots"></div><p id="spot-note" aria-live="polite"></p><div id="credit"></div></div></div></dialog>
<template id="motif">{{MOTIF}}</template><template id="fret"><svg preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 280" aria-label="原创方折回纹构成示意"><defs><pattern id="weave" width="90" height="90" patternUnits="userSpaceOnUse" patternTransform="rotate(-12)"><rect width="90" height="90" fill="#34463c"/><path d="M-4 8h82v69H15V23h48v40H29V36h20v14h-8" fill="none" stroke="#c2c7a8" stroke-width="5"/><path d="M-4 3h87v79H9" fill="none" stroke="#a27e56" stroke-width="1.4"/></pattern></defs><rect width="480" height="280" fill="url(#weave)"/></svg></template>
<script>{{JS}}</script></body></html>
